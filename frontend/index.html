<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      `interactive-widget=resizes-visual` says the on-screen keyboard must
      overlay the page rather than shrink the layout viewport.

      Without it, focusing a field can shorten `100dvh` by a third, and every
      vertically-centred element on the page moves — then moves back when the
      field is blurred. That is a layout shift caused by typing, and it is the
      default behaviour in some browsers. `resizes-visual` keeps the layout
      still and lets the browser scroll the focused field into view instead,
      which is what people expect.

      It is the standardised half of the fix; `AuthCard` also aligns to the top
      on small screens, so the form stays put even where this is not honoured.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual"
    />
    <!--
      The pre-React fallback, and nothing more. Every route component states its
      own title and description through `usePageMeta`, which overwrites both as
      soon as the application mounts — see `src/hooks/usePageMeta.ts`.

      Static, and therefore in the default language (`ro`): this file has no
      access to i18n, and the moment it covers is over before i18n exists.
    -->
    <title>TimeSheet</title>
    <meta
      name="description"
      content="Pontaj, concedii și raportare pentru echipă."
    />
    <script>
      /*
       * Applies the right light/dark theme before the first paint.
       *
       * It has to be inline and it has to be here: any module runs after the
       * browser has already painted the page, so doing this in React means a
       * white flash on every load for anybody using dark mode.
       *
       * TWO constants are duplicated from `src/theme/theme.ts`, which says so:
       * the storage key and the `/app` prefix. This script has no module system
       * to import them from and must decide before React exists.
       *
       * The `/app` check is the same rule `isAccountThemePath` implements. The
       * stored choice belongs to a signed-in person, so it applies only under
       * `/app`; every public screen — the login form above all — follows the
       * operating system, because there is nobody there yet whose preference it
       * could be. Without this check the login screen would flash the previous
       * user's dark mode and then correct itself, which is the exact flash this
       * script exists to prevent.
       *
       * Nothing else belongs here — the palette and the radius come from the
       * account and cannot be known before the profile is read.
       */
      (function () {
        try {
          var path = window.location.pathname;
          var isAccountArea = path === "/app" || path.indexOf("/app/") === 0;
          var mode = isAccountArea
            ? localStorage.getItem("crm-timesheet.color-mode") || "system"
            : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* Storage disabled: fall through to the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
